<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CV Scorer</title>
<style>
body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; background:#f7f7f8; }
label, textarea, input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; font-size: 14px; }
button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
.card { background:white; padding:20px; margin:15px 0; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.skill-chip { display:inline-block; padding:4px 8px; margin:2px; border-radius:12px; font-size:14px; color:white; }
.skill-yes { background:#10b981; } /* green */
.skill-no { background:#ef4444; } /* red */
.progress-bar { height:14px; border-radius:6px; background:#e5e7eb; margin:5px 0; }
.progress-fill { height:14px; border-radius:6px; background:#2563eb; }
button.export { margin-top:10px; background:#10b981; }
</style>
</head>
<body>

<h1>CV Scorer</h1>

<label>Job Description (PDF/Word)</label>
<input type="file" id="jdFile" accept=".pdf,.doc,.docx">

<label>CVs (PDF/Word, multiple)</label>
<input type="file" id="cvFiles" accept=".pdf,.doc,.docx" multiple>

<label>Skills (optional)</label>
<textarea id="skills" placeholder="Excel, SQL, Power BI"></textarea>

<button id="submitBtn">Score CVs</button>
<div id="result"></div>

<button class="export" id="exportCSV">Export CSV</button>
<button class="export" id="exportPDF">Export PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script>
const submitBtn = document.getElementById("submitBtn");
const resultDiv = document.getElementById("result");
let lastResults = null;

submitBtn.addEventListener("click", async () => {
  const jdInput = document.getElementById("jdFile");
  const cvInput = document.getElementById("cvFiles");
  const skillsText = document.getElementById("skills").value;
  let skills = skillsText.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);

  if (!jdInput.files.length) return alert("Please upload a Job Description.");
  if (!cvInput.files.length) return alert("Please upload at least one CV.");

  const formData = new FormData();
  formData.append("jdFile", jdInput.files[0]);
  for (const file of cvInput.files) formData.append("cvFiles", file);
  formData.append("skills", skills.join(","));

  resultDiv.innerHTML = "<p>Scoring CVs… please wait</p>";

  try {
    const resp = await fetch("/upload", { method: "POST", body: formData });
    const data = await resp.json();
    lastResults = data;

    if (!data.results) { resultDiv.innerHTML="<p>No results returned</p>"; return; }

    // Sort candidates by JD match descending
    const sortedResults = data.results.sort((a,b) => b.jdMatchScore - a.jdMatchScore);

    resultDiv.innerHTML = "";
    sortedResults.forEach((cv,index)=>{
      const card = document.createElement("div");
      card.className = "card";

      // Candidate Name + badge
      let badge = "";
      if(index === 0) badge = " 🏆";
      else if(index === 1) badge = " 🥈";
      else if(index === 2) badge = " 🥉";
      card.innerHTML += `<h2>${cv.filename}${badge}</h2>`;

      // JD Match
      const percent = (cv.jdMatchScore/5)*100;
      card.innerHTML += `<div>JD Match: ${cv.jdMatchScore}/5</div>`;
      card.innerHTML += `<div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>`;

      // Top 10 skills
      const sortedSkills = cv.skills.sort((a,b)=>b.score - a.score);
      const topSkills = sortedSkills.slice(0,10);
      let skillsHTML = "";
      topSkills.forEach(skill => {
        const cls = skill.score ? "skill-yes" : "skill-no";
        skillsHTML += `<span class="skill-chip ${cls}">${skill.skill}</span>`;
      });
      if(sortedSkills.length > 10){
        skillsHTML += `<span style="margin-left:5px; font-size:12px; color:#6b7280">+${sortedSkills.length-10} more</span>`;
      }
      card.innerHTML += `<div style="margin-top:10px">${skillsHTML}</div>`;

      // Summary
      card.innerHTML += `<p style="margin-top:10px; color:#6b7280">${cv.summary}</p>`;

      resultDiv.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    resultDiv.innerHTML="<p>Error scoring CVs</p>";
  }
});

// CSV export
document.getElementById("exportCSV").addEventListener("click", ()=>{
  if(!lastResults) return alert("No results");
  const rows=[];
  const headers=["Candidate","JD Match",...lastResults.allSkills,"Summary"];
  rows.push(headers.join(","));
  lastResults.results.forEach(cv=>{
    const row=[cv.filename,cv.jdMatchScore];
    lastResults.allSkills.forEach(skill=>{
      const sObj=cv.skills.find(s=>s.skill===skill);
      row.push(sObj?.score?"1":"0");
    });
    row.push(`"${cv.summary}"`);
    rows.push(row.join(","));
  });
  const csvContent="data:text/csv;charset=utf-8,"+rows.join("\n");
  const link=document.createElement("a");
  link.setAttribute("href",encodeURI(csvContent));
  link.setAttribute("download","cv_scores.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// PDF export
document.getElementById("exportPDF").addEventListener("click", ()=>{
  if(!lastResults) return alert("No results");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Sort candidates by JD match descending for PDF too
  const sortedResults = lastResults.results.sort((a,b)=>b.jdMatchScore - a.jdMatchScore);

  sortedResults.forEach((cv,i)=>{
    if(i>0) doc.addPage();
    doc.setFontSize(16);
    doc.text(cv.filename,14,20);
    doc.setFontSize(12);
    doc.text(`JD Match: ${cv.jdMatchScore}/5`,14,28);
    // Skills table with all skills
    const skillsTable = lastResults.allSkills.map(skill=>{
      const sObj=cv.skills.find(s=>s.skill===skill);
      return [skill,sObj?.score?"✅":"❌"];
    });
    doc.autoTable({
      startY:36,
      head:[["Skill","Match"]],
      body:skillsTable,
      theme:'grid'
    });
    doc.text("Summary:",14,36+skillsTable.length*10+4);
    doc.text(cv.summary,14,36+skillsTable.length*10+10);
  });

  doc.save("cv_scores.pdf");
});
</script>
</body>
</html>
