<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CV Skill Scorer</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; }
    textarea, input, button { width: 100%; margin: 10px 0; padding: 10px; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    .result { margin-top: 20px; }
  </style>
</head>
<body>

  <h1>CV Skill Scorer</h1>

  <label>Upload CV (PDF)</label>
  <input type="file" id="cvFile" accept="application/pdf" />

  <label>Skills (comma separated)</label>
  <textarea id="skills" placeholder="Excel, Power BI, SQL"></textarea>

  <button id="submitBtn">Score CV</button>

  <div class="result" id="result"></div>

  <script>
    const submitBtn = document.getElementById("submitBtn");
    const resultDiv = document.getElementById("result");

    submitBtn.addEventListener("click", async () => {
      const fileInput = document.getElementById("cvFile");
      const skillsText = document.getElementById("skills").value;
      const skills = skillsText.split(",").map(s => s.trim()).filter(Boolean);

      if (!skills.length) {
        alert("Please enter at least one skill");
        return;
      }

      if (!fileInput.files.length) {
        alert("Please upload a PDF CV");
        return;
      }

      const formData = new FormData();
      formData.append("cvFile", fileInput.files[0]);
      formData.append("skills", skills.join(","));

      resultDiv.innerHTML = "Scoring CV…";

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        resultDiv.innerHTML = "<h3>Results</h3>" +
          data.scores.map(s =>
            `<p>${s.skill}: ${s.score ? "✅" : "❌"}</p>`
          ).join("");

      } catch (err) {
        resultDiv.innerHTML = "Error scoring CV";
        console.error(err);
      }
    });
  </script>

</body>
</html>
